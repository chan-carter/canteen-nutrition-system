# 应用公共配置：被 80 与 443 两个 server 块 include，避免两处改漏
# 安装位置：/etc/nginx/snippets/canteen-app.conf

root /var/www/canteen/dist;
index index.html;

charset utf-8;
client_max_body_size 20m;

gzip              on;
gzip_min_length   1k;
gzip_comp_level   5;
gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
gzip_vary         on;

# 只用 expires 不用 add_header：同层级出现 add_header 会整体顶掉 443 站点继承下来的 Strict-Transport-Security
location ~* /assets/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
    expires 30d;
}

# ACME HTTP-01 校验：必须放在 dist 之外，否则每次前端发版轮换 dist 会把校验目录一起删掉，
# 导致 90 天后证书自动续期静默失败（本项目踩过：表现为 403）
location ^~ /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    default_type text/plain;
    allow all;
}

# /api/xxx -> http://127.0.0.1:8080/xxx
location ^~ /api/ {
    proxy_pass http://canteen_backend/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    # AI 营养分析单次调用可能接近 20 秒，读超时留出余量
    proxy_connect_timeout 10s;
    proxy_read_timeout    90s;
    proxy_send_timeout    90s;
}

# 入口文件必须每次回源校验，否则前端发版后用户拿到的还是旧 index.html
location = /index.html {
    expires -1;
}

# Vue Router history 模式回落到 index.html
location / {
    try_files $uri $uri/ /index.html;
}
