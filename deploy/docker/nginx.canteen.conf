server {
    listen 80 default_server;
    # 域名未备案时阿里云会按域名拦截，IP 直连不受影响，因此保留 default_server
    server_name wzbc.webchan.cn _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    client_max_body_size 8m;

    # 以后签 Let's Encrypt 用的校验目录，独立于前端产物，rotating dist 时不会被清掉
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }

    location ^~ /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 营养分析单次调用可能几十秒，读超时不能沿用默认的 60s
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location ~* /assets/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # 入口文件必须每次回源校验，否则前端发版后用户拿到的还是旧 index.html
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
