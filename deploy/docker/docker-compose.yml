services:
  mysql:
    image: mysql:8.0
    container_name: canteen-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?未在 .env 里设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: canteen_nutrition
      MYSQL_USER: canteen
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?未在 .env 里设置 MYSQL_PASSWORD}
    # 1.6G 内存的机器必须削 InnoDB 缓冲池并关掉 performance_schema，否则 MySQL 自己就吃掉大半内存
    # 排序规则与建库脚本保持一致（utf8mb4_general_ci），时区固定 +08:00 避免 now() 差 8 小时
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=192M
      - --performance-schema=OFF
      - --max-connections=80
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据目录为空时执行一次；要重建数据库就 docker volume rm 后重新 up
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    # 不向宿主机映射端口：数据库只在 compose 内部网络可达

  redis:
    image: redis:7-alpine
    container_name: canteen-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: eclipse-temurin:17-jre-alpine
    container_name: canteen-backend
    restart: unless-stopped
    working_dir: /app
    env_file: ./canteen.env
    command: ["sh", "-c", "java $$JAVA_OPTS -jar /app/app.jar"]
    volumes:
      - ./artifacts/canteen-server-1.0.0.jar:/app/app.jar:ro
      - backend-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 注意：/api 前缀由 nginx 剥掉，容器内直接是 /captcha
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/captcha | grep -q '\"code\":1'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  web:
    image: nginx:1.27-alpine
    container_name: canteen-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./artifacts/dist:/usr/share/nginx/html:ro
      - ./nginx.canteen.conf:/etc/nginx/conf.d/default.conf:ro
      - ./letsencrypt:/var/www/letsencrypt
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  backend-logs:
