name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  backend:
    name: 后端构建与单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canteen-nutrition
    steps:
      - uses: actions/checkout@v4
      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 编译并跑测试
        run: mvn -B test
      - name: 打包可执行 jar
        run: mvn -B -DskipTests package
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: canteen-server-jar
          path: canteen-nutrition/canteen-server/target/canteen-server-*.jar
          retention-days: 7

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canteen-nutrition-web
    steps:
      - uses: actions/checkout@v4
      - name: 准备 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: canteen-nutrition-web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 生产构建
        run: npm run build
      - name: 上传 dist
        uses: actions/upload-artifact@v4
        with:
          name: canteen-web-dist
          path: canteen-nutrition-web/dist
          retention-days: 7
