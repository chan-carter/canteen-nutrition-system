# 校园食堂菜品营养分析与推荐系统 —— 本地 nginx 部署配置
# 用法（Windows）：
#   D:/App/nginx-1.22.0-web/nginx.exe -p "D:/App/nginx-1.22.0-web" \
#       -c "D:/code/health/canteen-nutrition-web/deploy/nginx.conf"
# 前端静态资源与后端接口共用 80 端口，浏览器只访问 http://localhost，避免跨域
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # nginx 以 -c 指定本文件时，相对路径按本文件所在目录解析，故这里写绝对路径
    include       D:/App/nginx-1.22.0-web/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    access_log  logs/canteen-access.log;
    error_log   logs/canteen-error.log warn;

    # 静态资源压缩
    gzip              on;
    gzip_min_length   1k;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # 后端服务池，保持连接复用
    upstream canteen_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  localhost;
        charset      utf-8;

        # 与后端 spring.servlet.multipart 上限保持一致，留出余量
        client_max_body_size 20m;

        root  D:/code/health/canteen-nutrition-web/dist;
        index index.html;

        # 带指纹的静态资源可长期缓存
        location ~* /assets/.*\.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # /api/xxx -> http://127.0.0.1:8080/xxx
        location ^~ /api/ {
            proxy_pass http://canteen_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            # AI营养分析单次调用可能接近20秒
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
            proxy_send_timeout    60s;
        }

        # Vue Router history 模式：未命中的路径回落到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 入口文件不缓存，避免发版后浏览器仍加载旧包
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
